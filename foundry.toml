[profile.default]
src = "contracts"
test = "test/foundry"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/",
]
